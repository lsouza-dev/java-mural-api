spring.application.name=pensamento

spring.datasource.url=jdbc:postgresql://localhost:5432/pensamento
spring.datasource.username=${PGADMIN_USER}
spring.datasource.password=${PGADMIN_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.flyway.out-of-order=true
